<!-- ========================
skills-section.html
========================= -->

<div class="skills-text">
    <div class="decorative-line"></div>
    <h2 class="sub-headline">My Skills</h2>
    <p>I have grown my full-stack developments skills that
        have allowed me to create different real projects.
    </p>
    <button (click)="onNavigate('contact')"
        class="primary-btn contact-btn--wide">Get in
        touch</button>
</div>
<div class="skills-icons">
    @for (skill of skills; track skill.name) {
    <div class="skill-icon">
        <span [innerHTML]="skill.svg"></span>
        <span>{{ skill.name }}</span>
    </div>
    }
</div>
<button (click)="onNavigate('contact')"
    class="primary-btn contact-btn--mobile">Get in
    touch</button>
<img src="/img/skills/skills-fog.webp" alt="Light blue fog"
    class="light-blue-fog">
